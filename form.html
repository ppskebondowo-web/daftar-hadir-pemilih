<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entri Kehadiran TPS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
    body {
      background: radial-gradient(circle at top left, #064e3b, #020617 70%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 16px 14px;
      max-width: 480px;
      margin: 0 auto;
    }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }
    .topbar { padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .title-wrap { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
    h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
    .sub { font-size: 11px; color: #6ee7b7; margin-top: 2px; font-weight: 600; }
    .btn-group { display: flex; gap: 6px; }
    .btn-lihat {
      background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 7px 11px; border-radius: 11px; font-size: 12px; font-weight: 700; text-decoration: none;
    }
    .btn-logout {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 7px 12px; border-radius: 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .main-card {
      flex: 1;
      min-height: 0;
      margin: 10px 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow: hidden;
    }
    .search-wrap { position: relative; flex-shrink: 0; }
    .search-input {
      width: 100%; padding: 10px 36px 10px 14px; border-radius: 13px;
      background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 14px; outline: none;
    }
    .search-input:focus { border-color: #34d399; }
    .btn-clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #94a3b8; font-size: 15px; cursor: pointer; padding: 4px;
    }
    /* DAFTAR PEMILIH KUSTOM ANTI-DORONG */
    .voter-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 13px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .voter-item {
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 13px;
      color: #f1f5f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
    }
    .voter-item:active { background: rgba(16, 185, 129, 0.15); }
    .voter-item.selected {
      background: #059669;
      color: #ffffff;
      font-weight: 700;
      border-color: #34d399;
    }
    .voter-no { color: #34d399; font-weight: 800; margin-right: 6px; }
    .voter-item.selected .voter-no { color: #a7f3d0; }
    .voter-jk { font-size: 11px; opacity: 0.8; margin-left: 6px; flex-shrink: 0; }

    .detail-box {
      background: rgba(6, 78, 59, 0.45); border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 13px; padding: 10px 12px; flex-shrink: 0;
    }
    .detail-top { display: flex; justify-content: space-between; align-items: center; }
    .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #34d399; letter-spacing: 0.5px; }
    .badge-jk { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .detail-name { margin-top: 4px; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-no { color: #34d399; font-weight: 800; margin-right: 4px; }
    .footer { flex-shrink: 0; display: flex; flex-direction: column; gap: 7px; }
    .alert { padding: 8px 12px; border-radius: 11px; font-size: 12px; font-weight: 600; text-align: center; display: none; }
    .alert.success { display: block; background: rgba(6, 78, 59, 0.95); border: 1px solid #10b981; color: #a7f3d0; }
    .alert.error { display: block; background: rgba(127, 29, 29, 0.95); border: 1px solid #f43f5e; color: #fecdd3; }
    .btn-submit {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: linear-gradient(90deg, #10b981, #2dd4bf); color: #022c22;
      font-size: 14px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer;
    }
    .btn-submit:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="glass topbar">
    <div>
      <div class="title-wrap">
        <span class="dot"></span>
        <h1 id="header-tps">MEMUAT...</h1>
      </div>
      <div id="sub-tps" class="sub">Menyiapkan data DPT...</div>
    </div>
    <div class="btn-group">
      <a href="hadir.html" class="btn-lihat">Lihat Hadir</a>
      <button onclick="logout()" class="btn-logout">Keluar</button>
    </div>
  </div>

  <div class="glass main-card">
    <div class="search-wrap">
      <input type="text" id="search-dpt" onkeyup="filterDpt()" placeholder="Ketik Nama atau Nomor DPT..." class="search-input">
      <button onclick="clearSearch()" class="btn-clear">✕</button>
    </div>

    <div id="list-pemilih" class="voter-list"></div>

    <div class="detail-box">
      <div class="detail-top">
        <span class="lbl">Pemilih Terpilih</span>
        <span id="det-jk" class="badge-jk">-</span>
      </div>
      <div class="detail-name">
        <span id="det-nodpt" class="detail-no">#-</span>
        <span id="det-nama" style="font-style: italic; font-weight: 400; color: #94a3b8;">Ketuk nama pada daftar di atas</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div id="alert-box" class="alert"></div>
    <button onclick="handleSubmit()" id="btn-submit" disabled class="btn-submit">CATAT KEHADIRAN</button>
  </div>
  <script>
    const GAS_HOST = "https://script." + "://google.com";
    const GAS_ID = "AKfycbxml_1ZhNvG62Ik4ETR7W8JeBeOQVccXhuRe1A4IBrjjEIhjuE11ZIcbJjfUqOWA3meLA";
    const APPS_SCRIPT_URL = GAS_HOST + GAS_ID + "/exec";
    const GITHUB_BASE = "./";

    const currentTps = sessionStorage.getItem("active_tps");
    if (!currentTps) {
      window.location.href = "index.html";
    }

    let masterDpt = [], selectedVoter = null, isSubmitting = false;
    document.getElementById('header-tps').innerText = currentTps;

    function showToast(type, msg) {
      const box = document.getElementById('alert-box');
      box.className = "alert " + type;
      box.innerText = msg;
    }

    function hideToast() {
      document.getElementById('alert-box').className = "alert";
    }

    async function initDpt() {
      try {
        const res = await fetch(GITHUB_BASE + encodeURIComponent(currentTps + ".csv") + "?t=" + Date.now());
        if (!res.ok) throw new Error("Gagal memuat file DPT");
        const lines = (await res.text()).split(/\r?\n/);

        masterDpt = [];
        for (let j = 1; j < lines.length; j++) {
          const r = lines.at(j).split(';');
          if (r.length >= 3 && /^\d+$/.test(r.at(0).trim()) && r.at(0).trim() !== "") {
            masterDpt.push({
              noDpt: r.at(0).trim(),
              nama: r.at(1).trim(),
              jk: r.at(2).trim().toUpperCase()
            });
          }
        }

        const jmlL = masterDpt.filter(item => item.jk === 'L').length;
        const jmlP = masterDpt.filter(item => item.jk === 'P').length;

        document.getElementById('sub-tps').innerText = `DPT: ${masterDpt.length} (L: ${jmlL} | P: ${jmlP})`;
        renderList(masterDpt);
      } catch (e) {
        showToast('error', "Gagal memuat DPT: " + e.message);
      }
    }

    function renderList(data) {
      const container = document.getElementById('list-pemilih');
      if (data.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b; font-size:13px;">Nama atau nomor DPT tidak ditemukan.</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const isSel = selectedVoter && selectedVoter.noDpt === item.noDpt ? "selected" : "";
        return `
          <div class="voter-item ${isSel}" onclick="pilihPemilih('${item.noDpt}')">
            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              <span class="voter-no">[${item.noDpt}]</span>${item.nama}
            </div>
            <span class="voter-jk">(${item.jk})</span>
          </div>
        `;
      }).join('');
    }

    function filterDpt() {
      const kw = document.getElementById('search-dpt').value.toLowerCase();
      resetSelection();
      renderList(masterDpt.filter(i => i.nama.toLowerCase().includes(kw) || i.noDpt.toLowerCase().includes(kw)));
    }

    function clearSearch() {
      document.getElementById('search-dpt').value = "";
      filterDpt();
    }

    function resetSelection() {
      selectedVoter = null;
      document.getElementById('det-nodpt').innerText = "#-";
      const namaEl = document.getElementById('det-nama');
      namaEl.innerText = "Ketuk nama pada daftar di atas";
      namaEl.style.fontStyle = "italic";
      namaEl.style.fontWeight = "400";
      namaEl.style.color = "#94a3b8";
      document.getElementById('det-jk').innerText = "-";
      document.getElementById('btn-submit').disabled = true;
    }

    function pilihPemilih(noDpt) {
      selectedVoter = masterDpt.find(d => d.noDpt === String(noDpt));
      if (selectedVoter) {
        document.getElementById('det-nodpt').innerText = `#${selectedVoter.noDpt}`;
        const namaEl = document.getElementById('det-nama');
        namaEl.innerText = selectedVoter.nama;
        namaEl.style.fontStyle = "normal";
        namaEl.style.fontWeight = "700";
        namaEl.style.color = "#ffffff";
        document.getElementById('det-jk').innerText = selectedVoter.jk === 'L' ? 'Laki-laki' : 'Perempuan';
        document.getElementById('btn-submit').disabled = false;
        hideToast();

        // Tandai baris yang diketuk tanpa me-reset posisi gulir
        const kw = document.getElementById('search-dpt').value.toLowerCase();
        const currentFiltered = masterDpt.filter(i => i.nama.toLowerCase().includes(kw) || i.noDpt.toLowerCase().includes(kw));
        const scrollPos = document.getElementById('list-pemilih').scrollTop;
        renderList(currentFiltered);
        document.getElementById('list-pemilih').scrollTop = scrollPos;
      }
    }

    async function handleSubmit() {
      if (!selectedVoter || isSubmitting) return;
      isSubmitting = true;
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "MENYIMPAN...";
      hideToast();

      try {
        const params = new URLSearchParams({
          action: "simpan",
          tps: currentTps,
          noDpt: selectedVoter.noDpt,
          nama: selectedVoter.nama,
          jk: selectedVoter.jk,
          _t: Date.now()
        });

        const res = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`);
        const data = await res.json();

        if (data.status === 'success') {
          showToast('success', "✓ " + data.message);
          document.getElementById('search-dpt').value = "";
          resetSelection();
          renderList(masterDpt);
        } else {
          btn.disabled = false;
          showToast('error', "⚠ " + data.message);
        }
      } catch (err) {
        btn.disabled = false;
        showToast('error', "Gagal terhubung ke server: " + err.message);
      } finally {
        isSubmitting = false;
        btn.innerText = "CATAT KEHADIRAN";
      }
    }

    function logout() {
      sessionStorage.removeItem("active_tps");
      window.location.href = "index.html";
    }

    initDpt();
  </script>
</body>
</html>
