<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daftar Pemilih Hadir</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top right, #064e3b, #020617 70%);
      color: #f8fafc;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px;
      max-width: 480px;
      margin: 0 auto;
    }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }
    .topbar { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    h1 { font-size: 16px; font-weight: 800; color: #fff; }
    .sub { font-size: 12px; color: #fde047; font-weight: 700; margin-top: 2px; }
    .btn-group { display: flex; gap: 6px; }
    .btn-refresh, .btn-back {
      padding: 7px 12px; border-radius: 11px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
    }
    .btn-refresh { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.35); }
    .btn-back { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .card-list {
      flex: 1; min-height: 0; margin-top: 10px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .search-input {
      width: 100%; padding: 10px 14px; border-radius: 12px;
      background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 13px; outline: none; flex-shrink: 0;
    }
    .search-input:focus { border-color: #34d399; }
    .table-wrap { flex: 1; min-height: 0; overflow-y: auto; border-radius: 12px; border: 1px solid #1e293b; background: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    thead { position: sticky; top: 0; background: #064e3b; color: #a7f3d0; z-index: 1; }
    th { padding: 9px 8px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
    td { padding: 9px 8px; border-bottom: 1px solid #1e293b; color: #f1f5f9; }
    tr:nth-child(even) { background: rgba(30, 41, 59, 0.4); }
    .badge-dpt { color: #34d399; font-weight: 800; }
    .time-text { font-size: 10px; color: #94a3b8; display: block; margin-top: 2px; }
    .empty-msg { text-align: center; padding: 30px 16px; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>

  <div class="glass topbar">
    <div>
      <h1 id="title-tps">KEHADIRAN TPS</h1>
      <div id="count-hadir" class="sub">Memuat data hadir...</div>
    </div>
    <div class="btn-group">
      <button onclick="loadHadir()" id="btn-ref" class="btn-refresh">↻</button>
      <a href="form.html" class="btn-back">← Kembali</a>
    </div>
  </div>

  <div class="glass card-list">
    <input type="text" id="filter-hadir" onkeyup="filterTable()" placeholder="Cari nama atau nomor DPT yang hadir..." class="search-input">
    
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 36px;">No</th>
            <th style="width: 52px;">DPT</th>
            <th>Nama Pemilih</th>
            <th style="width: 34px;">JK</th>
          </tr>
        </thead>
        <tbody id="tbody-hadir">
          <tr><td colspan="4" class="empty-msg">Mengambil data dari Spreadsheet...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1z-oMimZ1X37aKE4YplJWeHF568e7-L3IMpUyqBsn97I";
    const currentTps = sessionStorage.getItem("active_tps");
    if (!currentTps) {
      window.location.href = "index.html";
    }

    document.getElementById('title-tps').innerText = `HADIR • ${currentTps}`;
    let dataHadir = [];

    function parseCsvLine(line) {
      const result = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line.at(i);
        if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      result.push(cur.trim());
      return result;
    }

    async function loadHadir() {
      const btn = document.getElementById('btn-ref');
      const tbody = document.getElementById('tbody-hadir');
      btn.innerText = "...";

      try {
        const query = encodeURIComponent("SELECT A, B, C, D, E OFFSET 7");
        const url = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(currentTps)}&tq=${query}&t=${Date.now()}`;
        
        const res = await fetch(url);
        if (!res.ok) throw new Error("Gagal akses Spreadsheet (HTTP " + res.status + ")");
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");

        dataHadir = [];
        for (let i = 0; i < lines.length; i++) {
          const cols = parseCsvLine(lines.at(i));
          if (cols.length >= 4 && /^\d+$/.test(cols.at(0)) && cols.at(2) !== "") {
            dataHadir.push({
              no: cols.at(0),
              noDpt: cols.at(1),
              nama: cols.at(2),
              jk: cols.at(3),
              ket: cols.at(4) || ""
            });
          }
        }

        dataHadir.reverse();
        document.getElementById('count-hadir').innerText = `Total Hadir: ${dataHadir.length} Pemilih`;
        renderTable(dataHadir);

      } catch (err) {
        document.getElementById('count-hadir').innerText = "Gagal memuat data";
        tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Pastikan akses Spreadsheet sudah diatur ke "Siapa saja yang memiliki link (Pelihat)".<br><small>${err.message}</small></td></tr>`;
      } finally {
        btn.innerText = "↻";
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('tbody-hadir');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Belum ada data pemilih hadir.</td></tr>`;
        return;
      }

      let html = "";
      list.forEach(item => {
        html += `
          <tr>
            <td>${item.no}</td>
            <td class="badge-dpt">#${item.noDpt}</td>
            <td>
              <div style="font-weight: 700;">${item.nama}</div>
              <span class="time-text">${item.ket}</span>
            </td>
            <td>${item.jk}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function filterTable() {
      const kw = document.getElementById('filter-hadir').value.toLowerCase();
      const filtered = dataHadir.filter(i => 
        i.nama.toLowerCase().includes(kw) || 
        i.noDpt.toLowerCase().includes(kw)
      );
      renderTable(filtered);
    }

    loadHadir();
  </script>
</body>
</html>
