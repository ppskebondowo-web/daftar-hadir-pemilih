<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Hadir Pemilih - Pilkades Kebondowo 2026</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
    <div class="bg-emerald-700 p-6 text-white text-center">
      <h1 class="text-lg font-bold tracking-wide">DAFTAR HADIR PEMILIH</h1>
      <p class="text-xs text-emerald-100 mt-1">Pemilihan Kepala Desa Kebondowo Tahun 2026</p>
      <div id="badge-tps" class="hidden mt-3 inline-block bg-emerald-900 text-emerald-100 text-xs font-semibold px-3 py-1 rounded-full"></div>
    </div>

    <!-- LOGIN -->
    <div id="view-login" class="p-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Masukkan Password Petugas TPS</label>
      <input type="password" id="input-password" placeholder="Masukkan kode akses TPS..." 
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none mb-4">
      <button onclick="handleLogin()" id="btn-login"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-sm">
        Masuk ke Form TPS
      </button>
    </div>

    <!-- FORM KEHADIRAN -->
    <div id="view-form" class="hidden p-6">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Cari Nama / Nomor DPT</label>
        <input type="text" id="search-dpt" onkeyup="filterDpt()" placeholder="Ketik nama atau nomor DPT..." 
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Daftar Pemilih DPT</label>
        <select id="select-pemilih" size="6" onchange="pilihPemilih()"
          class="w-full border border-gray-300 rounded-xl p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-gray-50">
        </select>
        <p class="text-[11px] text-gray-400 mt-1">*Ketuk nama pemilih pada daftar di atas</p>
      </div>

      <div id="detail-box" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 mb-4 text-sm">
        <div class="flex justify-between"><span class="text-gray-500">Nomor DPT:</span><span id="det-nodpt" class="font-bold text-gray-800">-</span></div>
        <div class="flex justify-between mt-1"><span class="text-gray-500">Nama Lengkap:</span><span id="det-nama" class="font-bold text-gray-800 text-right">-</span></div>
        <div class="flex justify-between mt-1"><span class="text-gray-500">Jenis Kelamin:</span><span id="det-jk" class="font-bold text-gray-800">-</span></div>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Keterangan (Opsional)</label>
        <input type="text" id="input-ket" placeholder="Kosongkan jika hadir normal..." 
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none text-sm mb-2">
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="setKet('Disabilitas')" class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-lg">+ Disabilitas</button>
          <button type="button" onclick="setKet('Didampingi')" class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-lg">+ Didampingi</button>
          <button type="button" onclick="setKet('Lansia')" class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-lg">+ Lansia</button>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="logout()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-xl text-sm">Keluar</button>
        <button onclick="handleSubmit()" id="btn-submit" disabled
          class="w-2/3 bg-emerald-600 disabled:bg-gray-300 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-sm shadow-sm">
          Catat Kehadiran
        </button>
      </div>
    </div>

    <!-- ALERT & ERROR LOG -->
    <div id="alert-box" class="hidden mx-6 mb-6 p-3.5 rounded-xl text-xs border">
      <div class="font-bold mb-1" id="alert-title"></div>
      <div id="alert-msg"></div>
      <div id="alert-code" class="mt-1.5 font-mono text-[10px] opacity-75"></div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxml_1ZhNvG62Ik4ETR7W8JeBeOQVccXhuRe1A4IBrjjEIhjuE11ZIcbJjfUqOWA3meLA/exec";
    const GITHUB_BASE = "./";

    let currentTps = "", masterDpt = [], selectedVoter = null;

    function setKet(t) { document.getElementById('input-ket').value = t; }
    function hideAlert() { document.getElementById('alert-box').classList.add('hidden'); }
    function showAlert(type, title, msg, code = "") {
      const box = document.getElementById('alert-box');
      box.className = "mx-6 mb-6 p-3.5 rounded-xl text-xs border block " + 
        (type === 'error' ? "bg-red-50 border-red-200 text-red-800" : "bg-emerald-50 border-emerald-200 text-emerald-800");
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-msg').innerText = msg;
      document.getElementById('alert-code').innerText = code ? `Kode Diagnostik: [${code}]` : "";
    }

    async function handleLogin() {
      const pass = document.getElementById('input-password').value.trim();
      const btn = document.getElementById('btn-login');
      if (!pass) return showAlert('error', 'Peringatan', 'Masukkan password terlebih dahulu.', 'ERR_EMPTY_PASS');

      hideAlert();
      btn.disabled = true;
      btn.innerText = "Memuat Data TPS...";

      try {
        const resPass = await fetch(GITHUB_BASE + "Password.csv?t=" + Date.now());
        if (!resPass.ok) throw new Error("Gagal membaca Password.csv (HTTP " + resPass.status + ")");
        const linesPass = (await resPass.text()).split(/\r?\n/);

        let foundTps = null;
        for (let i = 1; i < linesPass.length; i++) {
          const cols = linesPass[i].split(';');
          if (cols.length >= 2 && cols.trim() === pass) {
            foundTps = cols.trim();
            break;
          }
        }

        if (!foundTps) {
          btn.disabled = false; btn.innerText = "Masuk ke Form TPS";
          return showAlert('error', 'Gagal Masuk', 'Password salah atau tidak terdaftar.', 'ERR_AUTH');
        }

        const resDpt = await fetch(GITHUB_BASE + encodeURIComponent(foundTps + ".csv") + "?t=" + Date.now());
        if (!resDpt.ok) throw new Error(`Gagal memuat ${foundTps}.csv (HTTP ${resDpt.status})`);
        const linesDpt = (await resDpt.text()).split(/\r?\n/);

        masterDpt = [];
        for (let j = 1; j < linesDpt.length; j++) {
          const r = linesDpt[j].split(';');
          if (r.length >= 3 && /^\d+$/.test(r.trim()) && r.trim() !== "") {
            masterDpt.push({ noDpt: r.trim(), nama: r.trim(), jk: r.trim() });
          }
        }

        currentTps = foundTps;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-form').classList.remove('hidden');
        const badge = document.getElementById('badge-tps');
        badge.innerText = `AKTIF: ${currentTps} (${masterDpt.length} Pemilih)`;
        badge.classList.remove('hidden');
        renderDropdown(masterDpt);

      } catch (err) {
        showAlert('error', 'Kesalahan Jaringan/CSV', err.message, 'ERR_FETCH_CSV');
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk ke Form TPS";
      }
    }

    function renderDropdown(data) {
      const sel = document.getElementById('select-pemilih');
      sel.innerHTML = "";
      data.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.text = `[${item.noDpt}] ${item.nama} (${item.jk})`;
        opt.dataset.nodpt = item.noDpt;
        sel.appendChild(opt);
      });
    }

    function filterDpt() {
      const kw = document.getElementById('search-dpt').value.toLowerCase();
      renderDropdown(masterDpt.filter(i => i.nama.toLowerCase().includes(kw) || i.noDpt.toLowerCase().includes(kw)));
      selectedVoter = null;
      document.getElementById('detail-box').classList.add('hidden');
      document.getElementById('btn-submit').disabled = true;
    }

    function pilihPemilih() {
      const sel = document.getElementById('select-pemilih');
      const opt = sel.options[sel.selectedIndex];
      if (!opt) return;
      selectedVoter = masterDpt.find(d => d.noDpt === opt.dataset.nodpt);
      if (selectedVoter) {
        document.getElementById('det-nodpt').innerText = selectedVoter.noDpt;
        document.getElementById('det-nama').innerText = selectedVoter.nama;
        document.getElementById('det-jk').innerText = selectedVoter.jk === 'L' ? 'Laki-laki (L)' : 'Perempuan (P)';
        document.getElementById('detail-box').classList.remove('hidden');
        document.getElementById('btn-submit').disabled = false;
        hideAlert();
      }
    }

    async function handleSubmit() {
      if (!selectedVoter) return;
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "Menyimpan ke Spreadsheet...";
      hideAlert();

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            tps: currentTps,
            noDpt: selectedVoter.noDpt,
            nama: selectedVoter.nama,
            jk: selectedVoter.jk,
            keterangan: document.getElementById('input-ket').value
          })
        });
        const data = await res.json();

        if (data.status === 'success') {
          showAlert('success', 'Berhasil Tercatat', data.message);
          document.getElementById('search-dpt').value = "";
          document.getElementById('input-ket').value = "";
          document.getElementById('detail-box').classList.add('hidden');
          selectedVoter = null;
          renderDropdown(masterDpt);
        } else {
          btn.disabled = false;
          showAlert('error', 'Gagal Menyimpan', data.message, data.code);
        }
      } catch (err) {
        btn.disabled = false;
        showAlert('error', 'Gagal Terhubung ke Spreadsheet', err.message, 'ERR_POST_SHEET');
      } finally {
        btn.innerText = "Catat Kehadiran";
      }
    }

    function logout() {
      currentTps = "";
      masterDpt = [];
      selectedVoter = null;
      document.getElementById('input-password').value = "";
      document.getElementById('view-form').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      document.getElementById('badge-tps').classList.add('hidden');
      hideAlert();
    }

    document.getElementById('input-password').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
