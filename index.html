<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Pilkades Kebondowo 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top right, #064e3b, #020617 68%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
    }
    .spacer { height: 6px; }
    .container {
      width: 100%;
      max-width: 440px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header { text-align: center; }
    .pill {
      display: inline-block;
      padding: 5px 14px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.3);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #a7f3d0, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 22px;
      padding: 22px 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.6);
    }
    .lbl-center {
      display: block;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #6ee7b7;
      margin-bottom: 14px;
    }
    .pass-wrap { position: relative; width: 100%; margin-bottom: 14px; }
    .pass-input {
      width: 100%;
      padding: 16px 46px;
      border-radius: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.2s;
    }
    .pass-input:focus { border-color: #34d399; }
    .pass-input::placeholder { letter-spacing: normal; font-size: 14px; color: #64748b; }
    .btn-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-eye:hover { color: #34d399; }
    .btn-login {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(90deg, #10b981, #2dd4bf);
      color: #022c22;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .err-box {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(127, 29, 29, 0.85);
      border: 1px solid #f43f5e;
      color: #fecdd3;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    /* ADMIN PANEL STYLES */
    .hidden { display: none !important; }
    .admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .admin-title { font-size: 13px; font-weight: 800; color: #fde047; text-transform: uppercase; letter-spacing: 0.5px; }
    .admin-sub { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
    .admin-actions { display: flex; gap: 6px; }
    .btn-sm {
      padding: 7px 11px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer;
      background: #1e293b; border: 1px solid #334155; color: #34d399;
    }
    .btn-sm.exit { color: #fda4af; border-color: rgba(244, 63, 94, 0.3); }
    .prog-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #22d3ee); border-radius: 99px; transition: width 0.5s ease; }
    .tps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      max-height: 55dvh;
      overflow-y: auto;
      padding-right: 2px;
    }
    .tps-badge {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 15px;
      padding: 11px 12px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
      text-align: left;
    }
    .tps-badge:active { transform: scale(0.97); }
    .tps-badge:hover { border-color: #34d399; }
    .b-top { display: flex; justify-content: space-between; align-items: center; }
    .b-name { font-size: 12px; font-weight: 800; color: #34d399; }
    .b-pct { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .b-num { display: flex; justify-content: space-between; align-items: baseline; margin-top: 7px; }
    .b-hadir { font-size: 16px; font-weight: 800; color: #ffffff; }
    .b-dpt { font-size: 10px; color: #94a3b8; }
    .b-bar { width: 100%; height: 4px; background: #1e293b; border-radius: 99px; margin-top: 7px; overflow: hidden; }
    .b-fill { height: 100%; background: #34d399; border-radius: 99px; }
    .hint-tap { text-align: center; font-size: 11px; color: #64748b; margin-top: 10px; }
    .footer { text-align: center; font-size: 11px; color: #64748b; padding-top: 12px; }
  </style>
</head>
<body>

  <div class="spacer"></div>

  <div class="container">
    <div class="header">
      <div class="pill">E-Presensi TPS • Live System</div>
      <h1>PILKADES KEBONDOWO</h1>
      <div class="subtitle">Kecamatan Banyubiru • Kabupaten Semarang</div>
      <div id="live-clock" style="font-size: 11px; color: #34d399; font-weight: 400; margin-top: 8px; margin-bottom: 0px;">Memuat waktu...</div>
    </div>

    <!-- KARTU LOGIN -->
    <div id="login-card" class="glass">
      <label class="lbl-center" for="input-password">Akses Petugas KPPS</label>
      <div class="pass-wrap">
        <input type="password" id="input-password" class="pass-input" placeholder="Masukkan Password TPS">
        <button type="button" onclick="togglePassword()" class="btn-eye" id="btn-eye" title="Tampilkan/Sembunyikan Password">
          <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button onclick="handleLogin()" id="btn-login" class="btn-login">MASUK KE FORM TPS</button>
      <div id="login-error" class="err-box"></div>
    </div>

    <!-- PANEL ADMIN PUSAT -->
    <div id="admin-card" class="glass hidden">
      <div class="admin-head">
        <div>
          <div class="admin-title">Monitoring Panitia</div>
          <div class="admin-sub" id="admin-summary">Menghitung partisipasi...</div> 
        </div>
        <div class="admin-actions">
          <button onclick="loadAdminPanel()" id="btn-ref-admin" class="btn-sm">↻</button>
          <button onclick="logoutAdmin()" class="btn-sm exit">Keluar</button>
        </div>
      </div>

      <div class="prog-bg">
        <div id="admin-prog-bar" class="prog-fill"></div>
      </div>

      <div id="tps-grid" class="tps-grid"></div>
      <div class="hint-tap">*Ketuk badge TPS untuk melihat daftar pemilih hadir</div>
    </div>
  </div>

  <footer class="footer">
    &copy; Panitia Pemilihan Kepala Desa Kebondowo 2026
  </footer>
  <script>
    const GITHUB_BASE = "./";
    const SHEET_ID = "1c8FXsD2PT_bqXe3eIoO7jceb2DZeMwfEcrMgp55K-nw";

    function togglePassword() {
      const inp = document.getElementById('input-password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === "password") {
        inp.type = "text";
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        inp.type = "password";
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }
    function toggleFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}      
    function showError(msg) {
      const el = document.getElementById('login-error');
      el.innerText = msg;
      el.style.display = "block";
    }

    function activateAdminMode() {
      sessionStorage.setItem("is_admin", "true");
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('admin-card').classList.remove('hidden');
      loadAdminPanel();
    }

    function logoutAdmin() {
      sessionStorage.removeItem("is_admin");
      sessionStorage.removeItem("active_tps");
      document.getElementById('input-password').value = "";
      document.getElementById('admin-card').classList.add('hidden');
      document.getElementById('login-card').classList.remove('hidden');
    }

    function openTpsDetail(tpsName) {
      sessionStorage.setItem("active_tps", tpsName);
      window.location.href = "hadir.html";
    }

    async function handleLogin() {
      const pass = document.getElementById('input-password').value.trim();
      const btn = document.getElementById('btn-login');
      document.getElementById('login-error').style.display = "none";

      if (!pass) return showError("Masukkan password TPS terlebih dahulu.");

      // Cek Password AdminPusat
      if (pass === "AdminPusat") {
        activateAdminMode();
        return;
      }

      btn.disabled = true;
      btn.innerText = "MEMERIKSA AKSES...";

      try {
        const res = await fetch(GITHUB_BASE + "Password.csv?t=" + Date.now());
        if (!res.ok) throw new Error("Gagal membaca Password.csv");
        const lines = (await res.text()).split(/\r?\n/);

        let foundTps = null;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines.at(i).split(';');
          if (cols.length >= 2 && cols.at(0).trim() === pass) {
            foundTps = cols.at(1).trim();
            break;
          }
        }

        if (!foundTps) {
          btn.disabled = false;
          btn.innerText = "MASUK KE FORM TPS";
          return showError("Password salah atau tidak terdaftar.");
        }

        sessionStorage.removeItem("is_admin");
        sessionStorage.setItem("active_tps", foundTps);
        window.location.href = "form.html";

      } catch (err) {
        btn.disabled = false;
        btn.innerText = "MASUK KE FORM TPS";
        showError("Kesalahan: " + err.message);
      }
    }

    async function getSheetHadirCount(tpsName) {
      try {
        const query = encodeURIComponent("SELECT A, B, C, D, E OFFSET 0");
        const domain = "https://docs.google.com/spreadsheets/d/";
        const sheetId = "1c8FXsD2PT_bqXe3eIoO7jceb2DZeMwfEcrMgp55K-nw";
        const url = domain + sheetId + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(tpsName) + "&tq=" + query + "&t=" + Date.now();
        
        const res = await fetch(url);
        if (!res.ok) return 0;
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");

        let count = 0;
        for (let i = 0; i < lines.length; i++) {
          // Ambil nilai kolom A (No) dan kolom C (Nama) dengan membersihkan tanda kutip CSV
          const cols = lines.at(i).split(',').map(c => c.replace(/^"|"$/g, '').trim());
          if (cols.length >= 4 && /^\d+$/.test(cols.at(0)) && cols.at(2) !== "") {
            count++;
          }
        }
        return count;
      } catch (e) {
        return 0;
      }
    }

    async function loadAdminPanel() {
      const btn = document.getElementById('btn-ref-admin');
      const grid = document.getElementById('tps-grid');
      const sumEl = document.getElementById('admin-summary');
      btn.innerText = "...";
      sumEl.innerText = "Menghitung data 11 TPS...";

      const tasks = [];
      for (let i = 1; i <= 11; i++) {
        const tpsName = "TPS " + String(i).padStart(3, '0');
        tasks.push(
          Promise.all([
            fetch(`${GITHUB_BASE}${encodeURIComponent(tpsName + ".csv")}?t=${Date.now()}`).then(r => r.ok ? r.text() : ""),
            getSheetHadirCount(tpsName)
          ]).then(([csvTxt, hadirCount]) => {
            const dptCount = csvTxt.split(/\r?\n/).filter(l => /^\d+;/.test(l.trim())).length;
            return { tps: tpsName, dpt: dptCount, hadir: hadirCount };
          })
        );
      }

      const results = await Promise.all(tasks);
      let totalDpt = 0, totalHadir = 0, html = "";

      results.forEach(item => {
        totalDpt += item.dpt;
        totalHadir += item.hadir;
        const pct = item.dpt > 0 ? ((item.hadir / item.dpt) * 100).toFixed(1) : "0.0";
        const barWidth = Math.min(100, parseFloat(pct));

        html += `
          <div class="tps-badge" onclick="openTpsDetail('${item.tps}')">
            <div class="b-top">
              <span class="b-name">${item.tps}</span>
              <span class="b-pct">${pct}%</span>
            </div>
            <div class="b-num">
              <span class="b-hadir">${item.hadir}</span>
              <span class="b-dpt">/ ${item.dpt} DPT</span>
            </div>
            <div class="b-bar">
              <div class="b-fill" style="width: ${barWidth}%"></div>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
      const totalPct = totalDpt > 0 ? ((totalHadir / totalDpt) * 100).toFixed(1) : "0.0";
      sumEl.innerText = `Total: ${totalHadir} / ${totalDpt} Pemilih (${totalPct}%)`;
      document.getElementById('admin-prog-bar').style.width = `${Math.min(100, parseFloat(totalPct))}%`;
      btn.innerText = "↻";
    }

    document.getElementById('input-password').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleLogin();
    });

    // Jika kembali dari halaman hadir.html sebagai AdminPusat, langsung buka panel admin
    if (sessionStorage.getItem("is_admin") === "true") {
      activateAdminMode();
    }
        function updateClock() {
      const now = new Date();
      const tgl = now.toLocaleDateString('id-ID', {
        weekday: 'long', day: 'numeric', month: 'short', year: 'numeric'
      });
      const jam = now.toLocaleTimeString('id-ID', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).replace(/\./g, ':');
      
      const clockEl = document.getElementById('live-clock');
      if (clockEl) {
        clockEl.innerText = `${tgl} • ${jam} WIB`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
