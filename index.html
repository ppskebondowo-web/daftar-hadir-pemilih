<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pilkades Kebondowo 2026</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #064e3b, #020617 65%);
      color: #f8fafc;
    }
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-start md:justify-center">

  <div class="w-full max-w-md space-y-4 my-auto">
    
    <!-- Header Futuristik -->
    <div class="text-center space-y-1 pt-2">
      <span class="inline-block px-3 py-0.5 text-[10px] font-bold tracking-widest uppercase rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
        E-Presensi TPS • Live System
      </span>
      <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-emerald-200 to-teal-400 bg-clip-text text-transparent">
        PILKADES KEBONDOWO
      </h1>
      <p class="text-xs text-slate-400">Kecamatan Banyubiru • Kabupaten Semarang • 2026</p>
    </div>

    <!-- Card Login Petugas -->
    <div class="glass rounded-3xl p-5 shadow-2xl">
      <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-300 mb-2">
        Akses Petugas KPPS
      </label>
      <div class="flex gap-2">
        <input type="password" id="input-password" placeholder="Kode Password TPS..."
          class="w-full px-4 py-3 rounded-2xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 text-sm focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/30 outline-none transition">
        <button onclick="handleLogin()" id="btn-login"
          class="px-5 py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition whitespace-nowrap">
          Masuk
        </button>
      </div>
      <div id="login-error" class="hidden mt-3 text-xs text-rose-400 bg-rose-950/50 border border-rose-500/30 px-3 py-2 rounded-xl"></div>
    </div>

    <!-- Dashboard Rekapitulasi Partisipasi -->
    <div class="glass rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Partisipasi Pemilih Live</h2>
          <p class="text-[11px] text-slate-400" id="total-summary">Memuat data TPS...</p>
        </div>
        <button onclick="loadDashboard()" id="btn-refresh"
          class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition text-xs font-semibold">
          ↻ Segarkan
        </button>
      </div>

      <!-- Progress Bar Keseluruhan -->
      <div class="w-full bg-slate-800 rounded-full h-2 mb-4 overflow-hidden">
        <div id="total-bar" class="bg-gradient-to-r from-emerald-400 to-cyan-400 h-2 rounded-full transition-all duration-700" style="width: 0%"></div>
      </div>

      <!-- Grid 11 TPS -->
      <div id="tps-grid" class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto pr-1">
        <!-- Diisi otomatis via JS -->
      </div>
    </div>

  </div>

  <script>
    const APPS_SCRIPT_URL = "https://google.com";
    const GITHUB_BASE = "./";

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    async function handleLogin() {
      const pass = document.getElementById('input-password').value.trim();
      const btn = document.getElementById('btn-login');
      document.getElementById('login-error').classList.add('hidden');

      if (!pass) return showError("Masukkan password TPS terlebih dahulu.");

      btn.disabled = true;
      btn.innerText = "Cek...";

      try {
        const res = await fetch(GITHUB_BASE + "Password.csv?t=" + Date.now());
        if (!res.ok) throw new Error("Gagal membaca Password.csv");
        const lines = (await res.text()).split(/\r?\n/);

        let foundTps = null;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines.at(i).split(';');
          if (cols.length >= 2 && cols.at(0).trim() === pass) {
            foundTps = cols.at(1).trim();
            break;
          }
        }

        if (!foundTps) {
          btn.disabled = false;
          btn.innerText = "Masuk";
          return showError("Password tidak valid.");
        }

        sessionStorage.setItem("active_tps", foundTps);
        window.location.href = "form.html";

      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Masuk";
        showError("Kesalahan: " + err.message);
      }
    }

    async function loadDashboard() {
      const btn = document.getElementById('btn-refresh');
      const grid = document.getElementById('tps-grid');
      btn.innerText = "Memuat...";

      try {
        // Ambil jumlah hadir dari Spreadsheet & total DPT dari CSV secara paralel
        const sheetRes = await fetch(APPS_SCRIPT_URL);
        const sheetJson = await sheetRes.json();
        const rekapHadir = sheetJson.rekap || {};

        let grandTotalHadir = 0;
        let grandTotalDpt = 0;
        grid.innerHTML = "";

        const tpsPromises = [];
        for (let i = 1; i <= 11; i++) {
          const tpsName = "TPS " + String(i).padStart(3, '0');
          tpsPromises.push(
            fetch(GITHUB_BASE + encodeURIComponent(tpsName + ".csv"))
              .then(r => r.ok ? r.text() : "")
              .then(txt => {
                const rows = txt.split(/\r?\n/).filter(line => /^\d+;/.test(line.trim()));
                return { tps: tpsName, dpt: rows.length, hadir: rekapHadir[tpsName] || 0 };
              })
          );
        }

        const results = await Promise.all(tpsPromises);
        results.forEach(item => {
          grandTotalHadir += item.hadir;
          grandTotalDpt += item.dpt;
          const pct = item.dpt > 0 ? Math.round((item.hadir / item.dpt) * 100) : 0;

          grid.innerHTML += `
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-2.5 flex flex-col justify-between">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-emerald-400">${item.tps}</span>
                <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-300">${pct}%</span>
              </div>
              <div class="mt-1.5 flex items-baseline justify-between">
                <span class="text-sm font-extrabold text-white">${item.hadir}</span>
                <span class="text-[10px] text-slate-400">/ ${item.dpt} DPT</span>
              </div>
              <div class="w-full bg-slate-800 h-1 rounded-full mt-1.5 overflow-hidden">
                <div class="bg-emerald-400 h-1 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        });

        const totalPct = grandTotalDpt > 0 ? ((grandTotalHadir / grandTotalDpt) * 100).toFixed(1) : 0;
        document.getElementById('total-summary').innerText = `Total: ${grandTotalHadir} / ${grandTotalDpt} Pemilih (${totalPct}%)`;
        document.getElementById('total-bar').style.width = `${totalPct}%`;

      } catch (e) {
        document.getElementById('total-summary').innerText = "Gagal memuat rekap live.";
      } finally {
        btn.innerText = "↻ Segarkan";
      }
    }

    document.getElementById('input-password').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
    loadDashboard();
  </script>
</body>
</html>
