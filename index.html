<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Pilkades Kebondowo 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top right, #064e3b, #020617 68%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header { text-align: center; }
    .pill {
      display: inline-block;
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.3);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #a7f3d0, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .glass {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.6);
    }
    .lbl-center {
      display: block;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #6ee7b7;
      margin-bottom: 12px;
    }
    .pass-wrap { position: relative; width: 100%; margin-bottom: 12px; }
    .pass-input {
      width: 100%;
      padding: 15px 46px 15px 16px;
      border-radius: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.2s;
    }
    .pass-input:focus { border-color: #34d399; }
    .pass-input::placeholder { letter-spacing: normal; font-size: 14px; color: #64748b; }
    .btn-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-eye:hover { color: #34d399; }
    .btn-login {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(90deg, #10b981, #2dd4bf);
      color: #022c22;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .err-box {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(127, 29, 29, 0.85);
      border: 1px solid #f43f5e;
      color: #fecdd3;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .dash-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .dash-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: #e2e8f0; }
    .dash-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .btn-refresh {
      padding: 7px 11px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .prog-bg {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22d3ee);
      border-radius: 99px;
      transition: width 0.6s ease;
    }
    .tps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .tps-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 10px 12px;
    }
    .tps-top { display: flex; justify-content: space-between; align-items: center; }
    .tps-name { font-size: 12px; font-weight: 800; color: #34d399; }
    .tps-pct {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
    .tps-num { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
    .tps-hadir { font-size: 15px; font-weight: 800; color: #ffffff; }
    .tps-dpt { font-size: 10px; color: #94a3b8; }
    .mini-bar { width: 100%; height: 4px; background: #1e293b; border-radius: 99px; margin-top: 6px; overflow: hidden; }
    .mini-fill { height: 100%; background: #34d399; border-radius: 99px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="pill">E-Presensi TPS • Live System</div>
      <h1>PILKADES KEBONDOWO</h1>
      <div class="subtitle">Kecamatan Banyubiru • Kabupaten Semarang • 2026</div>
    </div>

    <div class="glass">
      <label class="lbl-center" for="input-password">Akses Petugas KPPS</label>
      <div class="pass-wrap">
        <input type="password" id="input-password" class="pass-input" placeholder="Masukkan Password TPS">
        <button type="button" onclick="togglePassword()" class="btn-eye" id="btn-eye" title="Tampilkan/Sembunyikan Password">
          <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button onclick="handleLogin()" id="btn-login" class="btn-login">MASUK KE FORM TPS</button>
      <div id="login-error" class="err-box"></div>
    </div>

    <div class="glass">
      <div class="dash-head">
        <div>
          <div class="dash-title">Partisipasi Pemilih Live</div>
          <div class="dash-sub" id="total-summary">Memuat data TPS...</div>
        </div>
        <button onclick="loadDashboard()" id="btn-refresh" class="btn-refresh">↻ Segarkan</button>
      </div>
      <div class="prog-bg">
        <div id="total-bar" class="prog-fill"></div>
      </div>
      <div id="tps-grid" class="tps-grid"></div>
    </div>
  </div>
  <script>
    const APPS_SCRIPT_URL = "https://google.com";
    const GITHUB_BASE = "./";

    function togglePassword() {
      const inp = document.getElementById('input-password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === "password") {
        inp.type = "text";
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        inp.type = "password";
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.innerText = msg;
      el.style.display = "block";
    }

    async function handleLogin() {
      const pass = document.getElementById('input-password').value.trim();
      const btn = document.getElementById('btn-login');
      document.getElementById('login-error').style.display = "none";

      if (!pass) return showError("Masukkan password TPS terlebih dahulu.");

      btn.disabled = true;
      btn.innerText = "MEMERIKSA AKSES...";

      try {
        const res = await fetch(GITHUB_BASE + "Password.csv?t=" + Date.now());
        if (!res.ok) throw new Error("Gagal membaca Password.csv");
        const lines = (await res.text()).split(/\r?\n/);

        let foundTps = null;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines.at(i).split(';');
          if (cols.length >= 2 && cols.at(0).trim() === pass) {
            foundTps = cols.at(1).trim();
            break;
          }
        }

        if (!foundTps) {
          btn.disabled = false;
          btn.innerText = "MASUK KE FORM TPS";
          return showError("Password salah atau tidak terdaftar.");
        }

        sessionStorage.setItem("active_tps", foundTps);
        window.location.href = "form.html";

      } catch (err) {
        btn.disabled = false;
        btn.innerText = "MASUK KE FORM TPS";
        showError("Kesalahan: " + err.message);
      }
    }

    async function loadDashboard() {
      const btn = document.getElementById('btn-refresh');
      const grid = document.getElementById('tps-grid');
      const sumEl = document.getElementById('total-summary');
      btn.innerText = "Memuat...";

      try {
        const sheetRes = await fetch(`${APPS_SCRIPT_URL}?_t=${Date.now()}`);
        if (!sheetRes.ok) throw new Error("HTTP " + sheetRes.status);
        const sheetJson = await sheetRes.json();
        const rekapHadir = sheetJson.rekap || {};

        let grandTotalHadir = 0;
        let grandTotalDpt = 0;

        const tpsPromises = [];
        for (let i = 1; i <= 11; i++) {
          const tpsName = "TPS " + String(i).padStart(3, '0');
          tpsPromises.push(
            fetch(`${GITHUB_BASE}${encodeURIComponent(tpsName + ".csv")}?t=${Date.now()}`)
              .then(r => r.ok ? r.text() : "")
              .then(txt => {
                const rows = txt.split(/\r?\n/).filter(line => /^\d+;/.test(line.trim()));
                return { tps: tpsName, dpt: rows.length, hadir: rekapHadir[tpsName] || 0 };
              })
          );
        }

        const results = await Promise.all(tpsPromises);
        let cardsHtml = "";

        results.forEach(item => {
          grandTotalHadir += item.hadir;
          grandTotalDpt += item.dpt;
          const pct = item.dpt > 0 ? Math.round((item.hadir / item.dpt) * 100) : 0;

          cardsHtml += `
            <div class="tps-card">
              <div class="tps-top">
                <span class="tps-name">${item.tps}</span>
                <span class="tps-pct">${pct}%</span>
              </div>
              <div class="tps-num">
                <span class="tps-hadir">${item.hadir}</span>
                <span class="tps-dpt">/ ${item.dpt} DPT</span>
              </div>
              <div class="mini-bar">
                <div class="mini-fill" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = cardsHtml;
        const totalPct = grandTotalDpt > 0 ? ((grandTotalHadir / grandTotalDpt) * 100).toFixed(1) : 0;
        sumEl.innerText = `Total: ${grandTotalHadir} / ${grandTotalDpt} Pemilih (${totalPct}%)`;
        document.getElementById('total-bar').style.width = `${totalPct}%`;

      } catch (e) {
        sumEl.innerText = "Gagal memuat rekap: " + e.message;
      } finally {
        btn.innerText = "↻ Segarkan";
      }
    }

    document.getElementById('input-password').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleLogin();
    });

    loadDashboard();
  </script>
</body>
</html>
